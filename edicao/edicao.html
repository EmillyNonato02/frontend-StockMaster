<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style.css">
    <title>Editar Produto - StockMaster</title>
</head>
<body>
    <header>
        <h1>StockMaster</h1>
        <nav>
            <a href="../index.html">Início</a>
            <a href="../cadastro/cadastro.html">Cadastrar Produto</a>
            <a href="../produtos/produtos.html">Ver Tudo</a>
            <button id="theme-toggle">🌓 Tema</button>
        </nav>
    </header>
    <div class="container">
        <h2>Editar Produto</h2>
        <form id="formEdicao" class="card">
            <input type="text" id="edit-name" placeholder="Nome do Produto" required>
            <input type="number" id="edit-price" step="0.01" placeholder="Preço" required>
            <input type="text" id="edit-category" placeholder="Categoria" required>
            <textarea id="edit-description" placeholder="Descrição" rows="4"></textarea>
            <button type="submit">Salvar Alterações</button>
        </form>
    </div>
    <script src="../script.js"></script>
</body>
</html>
